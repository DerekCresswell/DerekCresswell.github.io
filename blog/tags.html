---
layout: default
title: Blogs By Tags
---
{% include all_tags.html %}

<hr />

<ul class="tags-header-list">
    {% for tag in site.tags %}
        <li class="tag-header-item">
            <h4 id="{{ tag[0] }}" class="tag-header">{{ tag[0] }}</h4>
            <ul>
                {% for post in tag[1] %}
                <li>
                    <span class="listing-date">{{ post.date | date: "%d/%m/%Y" }}</span>
                    |
                    <a href="{{ post.url }}">{{ post.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </li>
    {% endfor %}
</ul>
